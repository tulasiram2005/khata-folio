name: Verify shop ledger
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Browser journeys and accessibility
        run: |
          npm start > /tmp/khata-folio.log 2>&1 &
          curl --retry 12 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4173/readyz
          npm run test:browser
